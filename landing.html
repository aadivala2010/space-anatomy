<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landings in 3D</title>
<style>
:root{--bg:#05070c;--card:#0d111acc;--lo:#2a3242;--text:#c9d1dd;--muted:#8591a3;--strong:#f3f6fa;--acc:#ff8a3d;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:var(--card);backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--lo);border-radius:9px}
.top{position:fixed;top:12px;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.top h1{margin:0 8px 0 0;font-size:16px;font-weight:600;color:var(--strong);text-shadow:0 1px 6px #000}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:3px}
.seg a,.seg button{font:600 12px/1 var(--mono);letter-spacing:.04em;color:var(--muted);text-decoration:none;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
.seg a:hover,.seg button:hover{color:var(--strong)}
.seg [aria-pressed="true"]{background:var(--acc);color:#1a0d02}
.veh{margin-left:auto}
.hud{position:fixed;left:16px;bottom:78px;padding:12px 14px;font:13px/1.6 var(--mono);min-width:230px}
.hud b{color:var(--strong);font-weight:600}
.hud .t{font-size:20px;color:var(--strong);margin-bottom:2px}
.hud .st{color:var(--acc)}
.hud .now{color:var(--strong);font-family:system-ui,sans-serif;max-width:260px;margin-top:4px;display:none}
.ev{position:fixed;right:16px;top:64px;width:300px;max-height:calc(100% - 160px);overflow:auto;padding:6px;list-style:none;margin:0}
.ev button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:13px/1.4 system-ui,sans-serif;padding:6px 8px;border-radius:6px;cursor:pointer}
.ev button b{display:block;font:11px var(--mono);color:var(--muted)}
.ev button:hover{background:#ffffff10}
.ev button[data-on]{box-shadow:0 0 0 1px var(--acc);color:var(--strong)}
.ev button[data-on] b{color:var(--acc)}
.bar{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:10px;align-items:center;padding:8px 10px}
.bar input[type=range]{flex:1;accent-color:var(--acc)}
.bar .tm{font:12px var(--mono);color:var(--muted);min-width:110px;text-align:right}
.btn{font:600 12px/1 var(--mono);color:var(--text);background:#ffffff0d;border:1px solid var(--lo);padding:8px 11px;border-radius:7px;cursor:pointer}
.btn:hover{color:var(--strong);border-color:var(--muted)}
select.btn{padding:6px 8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:760px){.ev{display:none}.hud .now{display:block}.hud{bottom:118px;min-width:0}.bar{flex-wrap:wrap}.bar input[type=range]{flex-basis:100%;order:-1}.veh{margin-left:0}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="view"></div>
<div class="top">
  <h1>Landings in 3D</h1>
  <nav class="seg panel" id="tabs" aria-label="Landing">
    <button data-id="f9">Falcon 9 · droneship</button>
    <button data-id="sh">Super Heavy · tower catch</button>
    <button data-id="lm">Apollo LM · Moon</button>
    <button data-id="hls">Starship HLS · Moon</button>
  </nav>
  <nav class="seg panel veh" aria-label="Vehicles"><a href="sls.html">SLS</a><a href="starship.html">Starship</a><a href="falcon9.html">Falcon 9</a><a href="saturnv.html">Saturn V</a></nav>
</div>
<div class="hud panel" aria-live="off">
  <div class="t" id="met">T+00:00</div>
  <div>ALT <b id="alt">0</b></div>
  <div>DESCENT <b id="vv">0</b></div>
  <div>GROUND SPEED <b id="vh">0</b></div>
  <div class="st" id="st"></div>
  <div class="now" id="now"></div>
</div>
<ul class="ev panel" id="ev"></ul>
<div class="bar panel">
  <button class="btn" id="play" aria-label="Pause">❚❚</button>
  <button class="btn" id="restart">Restart</button>
  <input type="range" id="slider" min="0" max="1" step="0.01" value="0" aria-label="Timeline">
  <span class="tm" id="tm"></span>
  <select class="btn" id="speed" aria-label="Playback speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="10">10×</option></select>
  <div class="seg" id="cams"><button data-cam="chase">Chase cam</button><button data-cam="pad">Ground cam</button></div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// ---------------------------------------------------------------- profiles
// Scripted, not simulated. motion rows are [t s, along-track m, altitude m, along-track speed, vertical speed];
// positions are cubic Hermite through them so the speeds are exact at each row. Other tracks are [t, value], linear.
function herm(rows, t) {
  if (t <= rows[0][0]) return rows[0].slice(1);
  let i = 0;
  while (i < rows.length - 2 && t > rows[i + 1][0]) i++;
  const a = rows[i], b = rows[i + 1];
  if (t >= b[0]) return [b[1], b[2], 0, 0];
  const T = b[0] - a[0], s = (t - a[0]) / T, s2 = s * s, s3 = s2 * s;
  const p = (j) => (2 * s3 - 3 * s2 + 1) * a[j] + (s3 - 2 * s2 + s) * T * a[j + 2] + (-2 * s3 + 3 * s2) * b[j] + (s3 - s2) * T * b[j + 2];
  const v = (j) => ((6 * s2 - 6 * s) * (a[j] - b[j])) / T + (3 * s2 - 4 * s + 1) * a[j + 2] + (3 * s2 - 2 * s) * b[j + 2];
  return [p(1), p(2), v(1), v(2)];
}
function lin(rows, t) {
  if (t <= rows[0][0]) return rows[0][1];
  for (let i = 1; i < rows.length; i++) { const a = rows[i - 1], b = rows[i]; if (t <= b[0]) return a[1] + ((b[1] - a[1]) * (t - a[0])) / (b[0] - a[0]); }
  return rows[rows.length - 1][1];
}
const firstBelow = (m, alt) => { for (let t = 0; t < 1000; t += 0.05) if (herm(m, t)[1] <= alt) return Math.round(t * 10) / 10; };

const M = {
  // after the entry burn: ~250 m/s at 3 km, single-engine hoverslam at ~25 m/s², ~1.5 m/s at touchdown
  f9: [[0, -380, 3000, 35, -255], [7, -140, 1250, 30, -245], [13.8, -10, 140, 8, -75], [17.2, 0, 0, 0, -1.5]],
  // base height; the catch pins rest on the chopstick rails when the base is 36 m up
  sh: [[0, -1500, 4000, 110, -300], [7, -730, 1900, 110, -300], [15, -120, 460, 20, -60], [29, 0, 40, 0, -2], [31, 0, 36, 0, -1]],
  // Apollo 11-like: high gate at ~2.2 km, low gate ~150 m, ~1 m/s at contact
  lm: [[0, -9000, 2200, 150, -45], [100, -300, 150, 15, -8], [150, 0, 0, 0, -0.9]],
  hls: [[0, -6000, 3000, 120, -60], [60, -200, 200, 6, -10], [110, 0, 0, 0, -0.8]],
};
// self-check: altitude never dips below the ground or climbs on the way down
for (const [id, m] of Object.entries(M)) { let prev = Infinity; for (let t = 0; t <= m[m.length - 1][0] + 2; t += 0.02) { const h = herm(m, t)[1]; console.assert(h > -0.01 && h <= prev + 1e-6, `${id}: altitude misbehaves at t=${t.toFixed(2)}`); prev = h; } }
const tLM = firstBelow(M.lm, 1.7); // contact probes touch

// ---------------------------------------------------------------- renderer & shared bits
const D2R = Math.PI / 180, UP = new THREE.Vector3(0, 1, 0);
const sm = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.3, 300000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.5;
const roomEnv = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const hemi = new THREE.HemisphereLight(), sun = new THREE.DirectionalLight();
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
scene.add(hemi, sun, sun.target);
const world = new THREE.Group();
scene.add(world);

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
const cyl = (rt, rb, y0, y1, mat, parent, seg = 48, open = false) => mesh(new THREE.CylinderGeometry(rt, rb, y1 - y0, seg, 1, open), mat, parent, 0, (y0 + y1) / 2, 0);
function rod(a, b, r, mat, parent) { // cylinder from point a to point b
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), m = mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 10), mat, parent);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, B.clone().sub(A).normalize());
  return m;
}
function tex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const rng = (s) => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
const lattice = (cells, line, color) => (g, w, h) => {
  g.strokeStyle = color; g.lineWidth = line;
  for (let i = 0; i <= cells; i++) { const p = (i / cells) * w; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
};
const plumeTex = tex(4, 128, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#fff"); gr.addColorStop(0.5, "rgba(255,255,255,.35)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const dotTex = tex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });

// exhaust: an additive glowing tube that is brightest at the nozzle; set(power 0..1)
function plume(parent, x, y, z, r, len, color, { spread = 1.6, opacity = 1 } = {}) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  const mk = (rt, rb, c, o, sy) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, 1, 24, 1, true).translate(0, -0.5, 0), new THREE.MeshBasicMaterial({ color: c, map: plumeTex, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); m.scale.y = sy; g.add(m); };
  mk(r, r * spread, color, 0.6 * opacity, 1);
  mk(r * 0.6, r * 0.3, "#fff6e6", 0.9 * opacity, 0.4);
  return (p) => { g.visible = p > 0.02; g.scale.set(1, len * p * (0.93 + 0.07 * Math.random()), 1); };
}

// dust, spray or steam thrown out where the exhaust hits the ground
function particles({ n = 4000, color, size, drag, rise, gravity, life, opacity }) {
  const pos = new Float32Array(n * 3).fill(-1e5), vel = new Float32Array(n * 3), age = new Float32Array(n).fill(1e9);
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, map: dotTex, transparent: true, opacity, depthWrite: false }));
  pts.frustumCulled = false; world.add(pts);
  let head = 0, acc = 0;
  return {
    reset() { pos.fill(-1e5); age.fill(1e9); acc = 0; geo.attributes.position.needsUpdate = true; },
    step(dt, src) { // src: {x, y, z, r0, rate, speed, up}
      if (dt <= 0) return;
      acc += src.rate * dt;
      for (; acc >= 1; acc--) {
        const i = head++ % n, a = Math.random() * Math.PI * 2, s = src.speed * (0.4 + 0.8 * Math.random());
        pos.set([src.x + Math.cos(a) * src.r0, src.y + 0.3, src.z + Math.sin(a) * src.r0], i * 3);
        vel.set([Math.cos(a) * s, src.up * Math.random(), Math.sin(a) * s], i * 3);
        age[i] = 0;
      }
      const k = Math.exp(-drag * dt);
      for (let i = 0; i < n; i++) {
        if (age[i] > life) continue;
        age[i] += dt;
        const j = i * 3;
        if (age[i] > life) { pos[j + 1] = -1e5; continue; }
        vel[j] *= k; vel[j + 2] *= k; vel[j + 1] = vel[j + 1] * k + (rise - gravity) * dt;
        pos[j] += vel[j] * dt; pos[j + 1] = Math.max(src.y, pos[j + 1] + vel[j + 1] * dt); pos[j + 2] += vel[j + 2] * dt;
      }
      geo.attributes.position.needsUpdate = true;
    },
  };
}

function earthSky(top, fog, near, far) {
  scene.background = new THREE.Color(top);
  scene.fog = new THREE.Fog(fog, near, far);
  scene.environment = roomEnv;
  hemi.color.set("#d6e6ff"); hemi.groundColor.set("#2b3a4a"); hemi.intensity = 1.1;
  sun.color.set("#fff2df"); sun.intensity = 2.6;
}

// ---------------------------------------------------------------- vehicles (metres; root origin = feet / base)
function falcon9Booster() {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body); body.position.y = 2.28;
  const soot = tex(256, 1024, (g, w, h) => {
    g.fillStyle = "#eceef0"; g.fillRect(0, 0, w, h);
    const r = rng(9);
    for (let i = 0; i < 260; i++) { const x = r() * w, y = r() * h, low = y / h; g.strokeStyle = `rgba(28,24,20,${0.08 + 0.5 * low * low * r()})`; g.lineWidth = 2 + 10 * r(); g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 6, y + 60 + 200 * r()); g.stroke(); }
    const gr = g.createLinearGradient(0, h * 0.75, 0, h); gr.addColorStop(0, "rgba(20,18,16,0)"); gr.addColorStop(1, "rgba(20,18,16,.85)"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  const white = std("#ffffff", { map: soot, roughness: 0.55 }), black = std("#15171a", { roughness: 0.7 }), metal = std("#3c3f44", { metalness: 0.8, roughness: 0.4, side: THREE.DoubleSide });
  cyl(1.83, 1.83, 1.2, 42, white, body);
  cyl(1.83, 1.83, 42, 48.5, black, body);
  cyl(1.95, 1.95, 0.1, 1.4, metal, body);
  const bell = new THREE.CylinderGeometry(0.24, 0.47, 1.1, 20, 1, true);
  for (let i = -1; i < 8; i++) { const a = (i * Math.PI) / 4, r = i < 0 ? 0 : 1.25; mesh(bell, metal, body, Math.cos(a) * r, -0.35, Math.sin(a) * r); }
  const finMat = std("#a3a8ae", { metalness: 0.6, roughness: 0.4, map: tex(64, 64, lattice(5, 5, "#fff")), alphaTest: 0.5, side: THREE.DoubleSide });
  for (let i = 0; i < 4; i++) { const a = (i * Math.PI) / 2, f = mesh(new THREE.BoxGeometry(1.7, 1.4, 0.12), finMat, body, Math.cos(a) * 2.7, 46.5, Math.sin(a) * 2.7); f.rotation.y = -a; }
  const legMat = std("#1c1d20", { roughness: 0.5 }), legs = [];
  for (let i = 0; i < 4; i++) {
    const a = (i * Math.PI) / 2 + Math.PI / 4, holder = new THREE.Group(), pivot = new THREE.Group();
    holder.rotation.y = -a; body.add(holder); holder.add(pivot); pivot.position.set(1.95, 3.5, 0);
    mesh(new THREE.BoxGeometry(0.5, 9, 0.38), legMat, pivot, 0, 4.5, 0);
    mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.2, 16), legMat, pivot, 0, 9, 0);
    legs.push(pivot);
  }
  const fire = plume(body, 0, -0.9, 0, 0.45, 26, "#ffa64d");
  return { root, legs: (k) => legs.forEach((p) => (p.rotation.z = -k * 130 * D2R)), fire };
}

function superHeavy() {
  const root = new THREE.Group();
  const steelTex = tex(512, 1024, (g, w, h) => {
    g.fillStyle = "#c3c7cc"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(70,74,80,.45)"; g.lineWidth = 2;
    for (let y = 0; y < h; y += h / 36) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    const r = rng(4);
    for (let i = 0; i < 160; i++) { const y = r() > 0.5 ? r() * 90 : h - r() * 140; g.fillStyle = `rgba(40,34,28,${0.15 * r()})`; g.fillRect(r() * w, y, 4 + 20 * r(), 10 + 60 * r()); }
  });
  const steel = std("#ffffff", { map: steelTex, metalness: 0.85, roughness: 0.32 }), dark = std("#2a2c30", { metalness: 0.5, roughness: 0.5, side: THREE.DoubleSide });
  cyl(4.5, 4.5, 1.4, 69, steel, root);
  cyl(4.5, 4.5, 69, 72.5, dark, root);
  cyl(4.62, 4.62, 0, 1.6, dark, root);
  const bell = new THREE.CylinderGeometry(0.32, 0.62, 2.0, 18, 1, true), fires = [];
  const ring = (n, r, a0, lit) => { for (let i = 0; i < n; i++) { const a = a0 + (i * 2 * Math.PI) / n, x = Math.cos(a) * r, z = Math.sin(a) * r; mesh(bell, dark, root, x, 0.2, z); if (lit) fires.push(plume(root, x, -0.8, z, 0.55, 40, "#8fb6ff", { spread: 1.9 })); } };
  ring(3, 0.95, 0, true); ring(10, 2.3, 0.3, true); ring(20, 3.75, 0, false);
  const finMat = std("#7c8086", { metalness: 0.7, roughness: 0.4, map: tex(64, 64, lattice(6, 5, "#fff")), alphaTest: 0.5, side: THREE.DoubleSide });
  for (let i = 0; i < 4; i++) { const a = Math.PI / 4 + (i * Math.PI) / 2, f = mesh(new THREE.BoxGeometry(4, 3.2, 0.45), finMat, root, Math.cos(a) * 6.5, 67.6, Math.sin(a) * 6.5); f.rotation.y = -a; }
  for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(1.6, 0.8, 1.2), dark, root, s * 5.3, 65.4, 0); // catch pins
  return { root, fires };
}

function lunarModule() {
  const root = new THREE.Group();
  const gold = std("#c9a23a", { metalness: 0.35, roughness: 0.45 }), foil = std("#2d2a25", { roughness: 0.5 }), grey = std("#a7abb0", { roughness: 0.55 }), dark = std("#222", { side: THREE.DoubleSide });
  mesh(new THREE.CylinderGeometry(2.1, 2.1, 1.65, 8), gold, root, 0, 2.45, 0).rotation.y = Math.PI / 8;
  mesh(new THREE.CylinderGeometry(0.42, 0.8, 1.4, 24, 1, true), dark, root, 0, 1.0, 0);
  const probes = [];
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + (i * Math.PI) / 2, c = Math.cos(a), s = Math.sin(a), f = [c * 4.3, 0.2, s * 4.3];
    rod([c * 1.9, 3.1, s * 1.9], f, 0.09, gold, root);
    rod([c * 1.9, 1.7, s * 1.9], [c * 3.3, 1.1, s * 3.3], 0.06, grey, root);
    mesh(new THREE.CylinderGeometry(0.47, 0.4, 0.2, 20), grey, root, f[0], 0.1, f[2]);
    if (i !== 1) { const p = mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.6, 6).translate(0, -0.8, 0), grey, root, f[0], 0.05, f[2]); probes.push(p); }
  }
  // ascent stage: cabin, front face with windows, tanks, thruster quads, docking hatch, antenna
  const cab = mesh(new THREE.CylinderGeometry(1.25, 1.25, 2.6, 12), grey, root, 0.1, 4.6, 0); cab.rotation.z = Math.PI / 2;
  mesh(new THREE.BoxGeometry(0.6, 2.0, 2.4), grey, root, 1.35, 4.35, 0);
  for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(0.05, 0.5, 0.5), std("#0b0d10", { roughness: 0.2, metalness: 0.6 }), root, 1.67, 4.9, s * 0.55).rotation.x = s * 0.3;
  mesh(new THREE.BoxGeometry(1.6, 1.8, 2.8), foil, root, -1.2, 4.3, 0);
  mesh(new THREE.SphereGeometry(0.6, 16, 12), grey, root, -0.6, 4.2, 1.75);
  for (let i = 0; i < 4; i++) { const a = Math.PI / 4 + (i * Math.PI) / 2; mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), foil, root, Math.cos(a) * 1.9, 5.3, Math.sin(a) * 1.9); }
  cyl(0.45, 0.5, 5.8, 6.3, grey, root, 20);
  rod([-1.3, 5.2, -0.9], [-1.9, 6.4, -1.3], 0.04, grey, root);
  mesh(new THREE.SphereGeometry(0.45, 16, 8, 0, Math.PI * 2, 0, 1.0), std("#ddd", { side: THREE.DoubleSide }), root, -1.9, 6.4, -1.3);
  const fire = plume(root, 0, 0.3, 0, 0.78, 14, "#ffcf8a", { spread: 5, opacity: 0.18 });
  return { root, fire, probes: (h) => probes.forEach((p) => (p.scale.y = Math.min(1, Math.max(0.02, (h + 0.05) / 1.6)))) };
}

function starshipHLS() {
  const root = new THREE.Group();
  const white = std("#eceef1", { roughness: 0.5, metalness: 0.1 }), dark = std("#1b2232", { roughness: 0.35, metalness: 0.4 }), steel = std("#8d9298", { metalness: 0.7, roughness: 0.35, side: THREE.DoubleSide });
  cyl(4.5, 4.5, 2, 38, white, root);
  cyl(4.52, 4.52, 38, 44, dark, root);
  cyl(1.0, 4.5, 44, 52.5, white, root);
  mesh(new THREE.SphereGeometry(1.0, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), white, root, 0, 52.5, 0);
  cyl(4.5, 4.5, 0.6, 2, steel, root);
  mesh(new THREE.BoxGeometry(0.6, 4, 3), white, root, 4.6, 31, 0); // airlock
  mesh(new THREE.BoxGeometry(0.3, 29, 0.8), steel, root, 4.65, 15, 0); // elevator rail
  for (let i = 0; i < 6; i++) { const a = (i * Math.PI) / 3 + Math.PI / 6, c = Math.cos(a), s = Math.sin(a); rod([c * 4.3, 5, s * 4.3], [c * 6.4, 0.3, s * 6.4], 0.25, steel, root); mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.3, 16), steel, root, c * 6.4, 0.15, s * 6.4); }
  const bell = (r, x, z, h) => mesh(new THREE.CylinderGeometry(r * 0.45, r, h, 20, 1, true), steel, root, x, 0.6 + h / 2, z);
  const raptors = [];
  for (let i = 0; i < 3; i++) { const a = (i * 2 * Math.PI) / 3, x = Math.cos(a), z = Math.sin(a); bell(0.65, x, z, 1.4); raptors.push(plume(root, x, 0.6, z, 0.6, 24, "#9cc0ff", { spread: 4, opacity: 0.22 })); bell(1.15, Math.cos(a + 1) * 2.9, Math.sin(a + 1) * 2.9, 2.2); }
  const thrusters = [];
  for (let i = 0; i < 12; i++) { const a = (i * Math.PI) / 6, x = Math.cos(a) * 4.75, z = Math.sin(a) * 4.75; mesh(new THREE.CylinderGeometry(0.12, 0.28, 0.6, 12, 1, true), steel, root, x, 35.5, z); thrusters.push(plume(root, x, 35.2, z, 0.26, 14, "#c9dcff", { spread: 5, opacity: 0.3 })); }
  return { root, raptors, thrusters };
}

// ---------------------------------------------------------------- environments
function moonWorld(sunElev, sunAz) {
  scene.background = new THREE.Color("#000");
  scene.fog = null;
  scene.environment = null;
  hemi.color.set("#9aa4b5"); hemi.groundColor.set("#222"); hemi.intensity = 0.12;
  sun.color.set("#fffaf2"); sun.intensity = 3.4;
  const sunDir = new THREE.Vector3(Math.cos(sunElev * D2R) * Math.cos(sunAz * D2R), Math.sin(sunElev * D2R), Math.cos(sunElev * D2R) * Math.sin(sunAz * D2R));
  // craters: many small ones round the site, big ones far out; flattened at the landing spot
  const r = rng(7), cr = [];
  for (let i = 0; i < 280; i++) cr.push([(r() - 0.5) * 3000, (r() - 0.5) * 3000, 3 + 40 * r() ** 2]);
  for (let i = 0; i < 160; i++) cr.push([(r() - 0.5) * 30000, (r() - 0.5) * 30000, 40 + 700 * r() ** 3]);
  const height = (x, z) => {
    let y = 4 * Math.sin(x / 700) * Math.cos(z / 900) + 1.2 * Math.sin(x / 170 + z / 230);
    for (const [cx, cz, cr0] of cr) { const d2 = (x - cx) ** 2 + (z - cz) ** 2; if (d2 > 2.2 * cr0 * cr0) continue; const q = Math.sqrt(d2) / cr0; y += cr0 * 0.16 * ((q < 1 ? q * q - 1 : 0) + 0.35 * Math.exp(-(((q - 1) / 0.22) ** 2))); }
    return y * sm(20, 160, Math.hypot(x, z));
  };
  const N = 280, S = 16000, geo = new THREE.PlaneGeometry(2, 2, N, N).rotateX(-Math.PI / 2), p = geo.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i), w = p.getZ(i), x = S * u * (0.02 + 0.98 * u * u), z = S * w * (0.02 + 0.98 * w * w); // dense near the site, sparse far out
    p.setXYZ(i, x, height(x, z), z);
    const c = 0.5 + 0.06 * (((Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1) + 1) % 1;
    col.set([c, c, c * 0.97], i * 3);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  mesh(geo, std("#ffffff", { vertexColors: true, roughness: 1 }), world).castShadow = false;
  const sg = new THREE.BufferGeometry(), sp = new Float32Array(2500 * 3);
  for (let i = 0; i < 2500; i++) { const v = new THREE.Vector3(r() - 0.5, r() * 0.9 + 0.02, r() - 0.5).normalize().multiplyScalar(100000); sp.set([v.x, v.y, v.z], i * 3); }
  sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
  world.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: "#fff", size: 1.3, sizeAttenuation: false, fog: false })));
  const earth = mesh(new THREE.SphereGeometry(660, 48, 24), std("#3d78c9", { roughness: 0.8, emissive: "#0a1830" }), world);
  earth.position.set(-15000, 30000, -22000).setLength(40000);
  earth.castShadow = false;
  return sunDir;
}

// each scenario returns { dur, speed, dir, chase, pad, focus, shadow, sunDir, events, tilt, ground(t), update(t, s, dt), status(t) }
const SCENES = {
  f9() {
    earthSky("#86acd6", "#a8c4e2", 800, 9000);
    const ocean = mesh(new THREE.PlaneGeometry(3000, 3000, 120, 120).rotateX(-Math.PI / 2), std("#1c4563", { roughness: 0.22, metalness: 0.2 }), world);
    ocean.castShadow = false;
    mesh(new THREE.PlaneGeometry(200000, 200000).rotateX(-Math.PI / 2), std("#1c4563", { roughness: 0.3 }), world, 0, -0.7, 0).castShadow = false;
    const ship = new THREE.Group(); world.add(ship);
    mesh(new THREE.BoxGeometry(91, 6, 52), std("#2c3036", { roughness: 0.8 }), ship);
    const deckTex = tex(512, 292, (g, w, h) => {
      g.fillStyle = "#3a3e44"; g.fillRect(0, 0, w, h);
      g.strokeStyle = "#e8e8e8"; g.lineWidth = 6; g.beginPath(); g.arc(w / 2, h / 2, h * 0.36, 0, Math.PI * 2); g.stroke();
      g.lineWidth = 14; g.beginPath(); g.moveTo(w / 2 - 50, h / 2 - 50); g.lineTo(w / 2 + 50, h / 2 + 50); g.moveTo(w / 2 + 50, h / 2 - 50); g.lineTo(w / 2 - 50, h / 2 + 50); g.stroke();
      g.fillStyle = "rgba(0,0,0,.25)"; for (let i = 0; i < 60; i++) g.fillRect(Math.random() * w, Math.random() * h, 30, 3);
    });
    mesh(new THREE.PlaneGeometry(91, 52).rotateX(-Math.PI / 2), std("#ffffff", { map: deckTex, roughness: 0.85 }), ship, 0, 3.01, 0);
    for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(91, 2.4, 1.2), std("#3b4048"), ship, 0, 4.2, s * 25.4);
    for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(6, 6, 6), std("#5a5f66"), ship, 40, 6, s * 18);
    const v = falcon9Booster(); world.add(v.root);
    const spray = particles({ color: "#e9eef3", size: 5, drag: 0.9, rise: 2.5, gravity: 0, life: 5, opacity: 0.28 });
    const legs = [[13.5, 0], [15.5, 1]], thr = [[0, 0], [6.9, 0], [7.4, 1], [13.8, 0.75], [17.2, 0.5], [17.6, 0]];
    const op = ocean.geometry.attributes.position, wave = (x, z, c) => 0.35 * Math.sin(x * 0.045 + c * 1.1) + 0.25 * Math.sin(z * 0.06 - c * 0.8) + 0.12 * Math.sin((x + z) * 0.13 + c * 1.7);
    let clock = 0;
    return {
      dur: 22, speed: 1, dir: [1, 0, 0], chase: [55, 10, 85], pad: [35, 9, 60], focus: 22, shadow: 60,
      sunDir: new THREE.Vector3(-0.5, 0.75, 0.4).normalize(), reset: spray.reset,
      tilt: [[0, 6], [7, 8], [14, 2], [17, 0]],
      events: [[0, "Falling through 3 km at ~920 km/h after the entry burn, grid fins steering"], [7, "Landing burn: the centre Merlin relights"], [13.5, "Landing legs swing down on helium pistons"], [17.2, "Touchdown on the droneship's X"], [17.6, "Engine cutoff"]],
      ground: (t) => 3 + 0.25 * Math.sin(clock * 0.7),
      update(t, s, dt) {
        clock += dt || 0.016;
        for (let i = 0; i < op.count; i++) op.setY(i, wave(op.getX(i), op.getZ(i), clock));
        op.needsUpdate = true; ocean.geometry.computeVertexNormals();
        ship.position.y = 0.25 * Math.sin(clock * 0.7); ship.rotation.x = 0.006 * Math.sin(clock * 0.5);
        v.legs(lin(legs, t));
        const p = lin(thr, t); v.fire(p);
        spray.step(dt, { x: s.pos.x, y: 3.3, z: s.pos.z, r0: 2, rate: s.h < 45 ? p * 500 * (1 - s.h / 45) : 0, speed: 28, up: 6 });
      },
      status: (t) => (lin(thr, t) > 0.02 ? `1 Merlin · ${Math.round(lin(thr, t) * 100)}%` : "Engines off") + (lin(legs, t) > 0.99 ? " · legs down" : ""),
      root: v.root,
    };
  },

  sh() {
    earthSky("#8db3dc", "#bcd0e4", 1500, 20000);
    const sand = mesh(new THREE.PlaneGeometry(100000, 50000).rotateX(-Math.PI / 2), std("#c8b48e", { roughness: 1 }), world, 0, 0, -24300);
    const sea = mesh(new THREE.PlaneGeometry(100000, 50000).rotateX(-Math.PI / 2), std("#2a5a7c", { roughness: 0.25, metalness: 0.2 }), world, 0, -0.3, 25700);
    sand.castShadow = sea.castShadow = false;
    mesh(new THREE.BoxGeometry(110, 0.4, 110), std("#a9abad", { roughness: 0.9 }), world, 0, 0.2, -10);
    const grey = std("#5d6268", { roughness: 0.6, metalness: 0.3 });
    // orbital launch mount under the catch point
    mesh(new THREE.CylinderGeometry(9.5, 9.5, 3, 40), grey, world, 0, 19.5, 0);
    for (let i = 0; i < 6; i++) { const a = (i * Math.PI) / 3; mesh(new THREE.BoxGeometry(2.6, 18, 2.6), std("#8e9194"), world, Math.cos(a) * 8.5, 9, Math.sin(a) * 8.5); }
    // tower: lattice box, a carriage and the two chopstick arms
    const lat = tex(128, 128, (g, w, h) => { g.strokeStyle = "#fff"; g.lineWidth = 9; g.strokeRect(0, 0, w, h); g.lineWidth = 5; g.beginPath(); g.moveTo(0, 0); g.lineTo(w, h); g.moveTo(w, 0); g.lineTo(0, h); g.stroke(); }, [1, 12]);
    const tw = mesh(new THREE.BoxGeometry(12, 146, 12), std("#6e7379", { map: lat, alphaTest: 0.5, side: THREE.DoubleSide, metalness: 0.4 }), world, 0, 73, -22);
    tw.castShadow = false;
    mesh(new THREE.BoxGeometry(13.6, 5, 13.6), grey, world, 0, 99.5, -22);
    const arms = [-1, 1].map((sd) => { const pv = new THREE.Group(); pv.position.set(sd * 6, 99.75, -16); world.add(pv); mesh(new THREE.BoxGeometry(1.6, 2.5, 36), std("#3a3d42", { metalness: 0.5, roughness: 0.5 }), pv, 0, 0, 18); return [pv, sd]; });
    const v = superHeavy(); world.add(v.root);
    const steam = particles({ color: "#eef1f4", size: 9, drag: 0.7, rise: 3, gravity: 0, life: 7, opacity: 0.25 });
    const t13 = [[0, 0], [6.9, 0], [7.4, 1], [14.6, 1], [15.2, 0]], t3 = [[0, 0], [6.9, 0], [7.4, 1], [30.4, 0.6], [30.8, 0]], open = [[26, 1], [29, 0]];
    return {
      dur: 36, speed: 1, dir: [0, 0, -1], chase: [110, 20, 150], pad: [140, 18, 110], focus: 36, shadow: 110,
      sunDir: new THREE.Vector3(0.6, 0.7, 0.5).normalize(), reset: steam.reset,
      tilt: [[0, 8], [15, 6], [25, 2], [29, 0]],
      events: [[0, "Coming back to Starbase at ~1,080 km/h after the boostback burn"], [7, "Landing burn: 13 Raptors light"], [15, "Down to the 3 centre engines for fine positioning"], [20, "Slides in over the launch mount, between the open chopsticks"], [26, "Chopsticks start to close"], [30.8, "Engines off · the catch pins settle onto the arms"]],
      ground: () => 0,
      update(t, s, dt) {
        const a = lin(open, t) * 32 * D2R;
        for (const [pv, sd] of arms) pv.rotation.y = -sd * a;
        const p13 = lin(t13, t), p3 = lin(t3, t);
        v.fires.forEach((f, i) => f(i < 3 ? p3 : p13));
        steam.step(dt, { x: s.pos.x, y: 0.5, z: s.pos.z, r0: 8, rate: s.h < 160 ? Math.max(p3, p13) * 600 * (1 - s.h / 160) : 0, speed: 35, up: 8 });
      },
      status: (t) => { const n = lin(t13, t) > 0.02 ? 13 : lin(t3, t) > 0.02 ? 3 : 0; return n ? `${n} Raptors lit` : "Engines off"; },
      root: v.root,
    };
  },

  lm() {
    const sunDir = moonWorld(11, 35); // Apollo 11 landed with the Sun ~10° up
    const v = lunarModule(); world.add(v.root);
    const dust = particles({ color: "#b7b2a8", size: 0.9, drag: 0, rise: 0, gravity: 1.62, life: 3.5, opacity: 0.55 });
    const thr = [[0, 0.6], [100, 0.35], [tLM + 1, 0.3], [tLM + 1.15, 0]];
    return {
      dur: 156, speed: 4, dir: [1, 0, 0], chase: [18, 4, 28], pad: [45, 2.5, 28], focus: 3, shadow: 40, sunDir, reset: dust.reset,
      tilt: [[0, 45], [60, 25], [100, 8], [140, 0]],
      events: [[0, "High gate, 2.2 km up: P64 approach, pitched back to brake"], [100, "Low gate, ~150 m: P66, the commander flies it by hand"], [firstBelow(M.lm, 30), "Engine exhaust starts blowing dust off the surface"], [tLM, "CONTACT LIGHT: a probe touches the surface"], [tLM + 1.1, "Engine stop · Apollo 11: “The Eagle has landed”"]],
      ground: () => 0,
      update(t, s, dt) {
        const p = lin(thr, t); v.fire(p); v.probes(s.h);
        dust.step(dt, { x: s.pos.x, y: 0, z: s.pos.z, r0: 1, rate: s.h < 30 ? p * 900 * (1 - s.h / 30) : 0, speed: 60, up: 4 });
      },
      status: (t) => (lin(thr, t) > 0.02 ? `Descent engine · ${Math.round(lin(thr, t) * 100)}%` : "Engine off"),
      root: v.root,
    };
  },

  hls() {
    const sunDir = moonWorld(4, 60); // the south pole: the Sun skims the horizon
    const v = starshipHLS(); world.add(v.root);
    const dust = particles({ color: "#a9a59d", size: 1.4, drag: 0, rise: 0, gravity: 1.62, life: 4, opacity: 0.5 });
    const rap = [[0, 0.7], [60, 0.5], [69.5, 0.5], [70.5, 0]], thr = [[69.5, 0], [70.5, 1], [109.6, 0.7], [110.3, 0]];
    return {
      dur: 116, speed: 4, dir: [1, 0, 0], chase: [60, 8, 95], pad: [130, 5, 85], focus: 25, shadow: 80, sunDir, reset: dust.reset,
      tilt: [[0, 30], [60, 6], [85, 0]],
      events: [[0, "3 km over the lunar south pole, braking on its Raptors"], [70, "Raptors off; the high-mounted landing thrusters take over so the exhaust hits the ground gently"], [firstBelow(M.hls, 40), "Thruster exhaust reaches the regolith"], [110, "Touchdown on six legs"], [110.3, "Thrusters off · Artemis landing site"]],
      ground: () => 0,
      update(t, s, dt) {
        const pr = lin(rap, t), pt = lin(thr, t);
        v.raptors.forEach((f) => f(pr)); v.thrusters.forEach((f) => f(pt));
        dust.step(dt, { x: s.pos.x, y: 0, z: s.pos.z, r0: 4, rate: s.h < 40 ? Math.max(pt, pr) * 500 * (1 - s.h / 40) : 0, speed: 45, up: 3 });
      },
      status: (t) => (lin(rap, t) > 0.02 ? "3 Raptors" : lin(thr, t) > 0.02 ? "12 landing thrusters" : "Engines off"),
      root: v.root,
    };
  },
};

// ---------------------------------------------------------------- player
const $ = (id) => document.getElementById(id);
const ui = { play: $("play"), slider: $("slider"), tm: $("tm"), speed: $("speed"), met: $("met"), alt: $("alt"), vv: $("vv"), vh: $("vh"), st: $("st"), now: $("now"), ev: $("ev") };
let cur, id, t = 0, playing = true, camMode = "chase", lastT = 0, motion, axis, dir;
const fmt = (s) => `T+${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const target = new THREE.Vector3();

function load(next) {
  world.traverse((o) => { o.geometry?.dispose(); [o.material].flat().forEach((m) => { m?.map?.dispose(); m?.dispose(); }); });
  world.clear();
  id = SCENES[next] ? next : "f9";
  cur = SCENES[id]();
  motion = M[id];
  dir = new THREE.Vector3(...cur.dir);
  axis = new THREE.Vector3().crossVectors(dir, UP);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -cur.shadow; sc.right = sc.top = cur.shadow; sc.near = 1; sc.far = 2000; sc.updateProjectionMatrix();
  t = 0; lastT = 0; playing = true;
  ui.slider.max = cur.dur; ui.speed.value = cur.speed;
  ui.ev.innerHTML = cur.events.map(([et, txt]) => `<li><button data-t="${et}"><b>${fmt(et)}</b>${txt}</button></li>`).join("");
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === id));
  history.replaceState(null, "", "#" + id);
  apply(0);
  camera.position.copy(target).add(new THREE.Vector3(...cur.chase));
  if (camMode === "pad") camera.position.set(...cur.pad);
  controls.target.copy(target);
}

function apply(dt) {
  const [x, h, vx, vh] = herm(motion, t);
  const g = cur.ground(t);
  const pos = dir.clone().multiplyScalar(x).setY(g + h);
  cur.root.position.copy(pos);
  cur.root.quaternion.setFromAxisAngle(axis, lin(cur.tilt, t) * D2R);
  cur.update(t, { x, h, pos }, dt);
  const prev = target.clone();
  target.copy(pos).add(new THREE.Vector3(0, cur.focus, 0));
  if (camMode === "chase") camera.position.add(target.clone().sub(prev));
  controls.target.copy(target);
  sun.position.copy(target).addScaledVector(cur.sunDir, 600);
  sun.target.position.copy(target);
  ui.met.textContent = fmt(t);
  ui.alt.textContent = h >= 1000 ? (h / 1000).toFixed(2) + " km" : h.toFixed(1) + " m";
  ui.vv.textContent = `${Math.abs(vh).toFixed(1)} m/s · ${Math.round(Math.abs(vh) * 3.6)} km/h`;
  ui.vh.textContent = `${Math.abs(vx).toFixed(1)} m/s`;
  ui.st.textContent = cur.status(t);
  let on = -1;
  cur.events.forEach(([et], i) => { if (t >= et - 1e-6) on = i; });
  [...ui.ev.querySelectorAll("button")].forEach((b, i) => (i === on ? b.setAttribute("data-on", "") : b.removeAttribute("data-on")));
  ui.now.textContent = on >= 0 ? cur.events[on][1] : "";
  ui.slider.value = t;
  ui.tm.textContent = `${fmt(t)} / ${fmt(cur.dur)}`;
}

function seek(nt) { t = Math.max(0, Math.min(cur.dur, nt)); cur.reset(); setPlaying(false); }
function setPlaying(p) { playing = p; ui.play.textContent = p ? "❚❚" : "▶"; ui.play.setAttribute("aria-label", p ? "Pause" : "Play"); }
function setCam(m) {
  camMode = m;
  document.querySelectorAll("#cams button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cam === m));
  camera.position.copy(m === "pad" ? new THREE.Vector3(...cur.pad) : target.clone().add(new THREE.Vector3(...cur.chase)));
}

document.getElementById("tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) load(b.dataset.id); };
document.getElementById("cams").onclick = (e) => { const b = e.target.closest("button"); if (b) setCam(b.dataset.cam); };
ui.ev.onclick = (e) => { const b = e.target.closest("button"); if (b) { seek(Number(b.dataset.t) - 0.5); setPlaying(true); } };
ui.play.onclick = () => { if (!playing && t >= cur.dur) seek(0); setPlaying(!playing); };
$("restart").onclick = () => { seek(0); setPlaying(true); };
ui.slider.oninput = () => seek(Number(ui.slider.value));
addEventListener("keydown", (e) => { if (e.key === " " && !e.target.closest("button,input,select")) { e.preventDefault(); ui.play.click(); } });
addEventListener("hashchange", () => location.hash.slice(1) !== id && load(location.hash.slice(1)));

function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize);
resize();
load(location.hash.slice(1));
setCam("chase");

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) { t += real * Number(ui.speed.value); if (t >= cur.dur) { t = cur.dur; setPlaying(false); } }
  const dt = t - lastT; lastT = t;
  apply(dt > 0 && dt < 1 ? dt : 0);
  controls.update();
  renderer.render(scene, camera);
});
</script>
